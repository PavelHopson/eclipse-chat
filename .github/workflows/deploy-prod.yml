name: Deploy PROD (master)

# Триггеры:
#   - push в master → автоматически валидирует и деплоит
#   - workflow_dispatch → ручной запуск из GitHub UI (с опциональным initial-setup
#     для первого деплоя на свежий сервер)
#
# v1.1.19: paths-ignore — docs-only коммиты (ROADMAP.md, docs/**, *.md)
# НЕ триггерят деплой. Раньше после каждого release'а ROADMAP-коммит
# запускал лишний workflow, который приходилось вручную отменять
# (`gh run cancel`) → красные "cancelled" checks в истории, путали.
# paths-ignore matches когда ВСЕ изменённые файлы попадают под паттерн —
# смешанный code+md коммит всё равно триггерит деплой.
on:
  push:
    branches: ["master"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      # Десктоп (Tauri) деплоится отдельно — релизы через тег desktop-v*
      # (.github/workflows/desktop-release.yml), НЕ через прод-пайплайн EC.
      # Поэтому desktop-only коммиты не должны дёргать редеплой web/server.
      - "apps/desktop/**"
      # Android (Capacitor) — то же самое: релизы через тег android-v*
      # (.github/workflows/android-release.yml). Android-only коммиты не деплоят EC.
      - "apps/android/**"
  workflow_dispatch:
    inputs:
      run_initial_setup:
        description: "Run deploy/initial-setup.sh on server (only first time)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Concurrency: не дать двум deploy'ям бежать одновременно. Если в очереди уже
# есть deploy — новый встаёт следом, не отменяя предыдущий (cancel-in-progress=false).
concurrency:
  group: eclipse-chat-prod-deploy
  cancel-in-progress: false

jobs:
  # ============================================================
  # 1. Validate — CI gate: TypeScript + production build должны пройти,
  #    иначе deploy не запустится. Защищает от broken master.
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspaces
        run: npm ci

      - name: Dependency audit (High/Critical)
        run: npm audit --audit-level=high

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests (server)
        run: npm test --workspace=@eclipse-chat/server

      - name: UI and release contracts
        run: node --test deploy/scripts/ui-shell-contract.test.mjs deploy/scripts/workspace-polish.test.mjs deploy/scripts/task-flow.test.mjs deploy/scripts/conversation-flow.test.mjs deploy/scripts/workspace-navigation.test.mjs deploy/scripts/voice-room-ui.test.mjs deploy/scripts/managed-environment.test.mjs

      - name: Production build (server + web)
        run: npm run build
        env:
          VITE_BASE_PATH: "/eclipse-chat/"

  # ============================================================
  # 2. Deploy — SSH в prod, запускает deploy/scripts/deploy.sh.
  #    Все шаги (git pull → build → migrate → nginx sync → restart → smoke)
  #    инкапсулированы в orchestrator на проде. CI-job только SSH'итин.
  # ============================================================
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production # требует manual approval в GitHub UI
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # --- Optional: первый деплой на свежий сервер ---
      # Запускается только при workflow_dispatch с run_initial_setup=true.
      # Создаёт PG БД, .env, supervisor program, nginx snippets с нуля.
      - name: Run initial setup (first deploy only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_initial_setup == 'true'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST_PROD }}
          username: ${{ secrets.DEPLOY_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          envs: ECLIPSE_CHAT_DB_PASSWORD,ECLIPSE_CHAT_JWT_SECRET
          script: |
            set -e
            DEPLOY_PATH="/var/www/eclipse-chat"
            if [ ! -d "$DEPLOY_PATH/deploy" ]; then
              if [ ! -d "$DEPLOY_PATH" ]; then
                sudo mkdir -p "$DEPLOY_PATH"
                sudo chown -R "$USER:$USER" "$DEPLOY_PATH"
              fi
              cd "$DEPLOY_PATH"
              git clone https://github.com/PavelHopson/eclipse-chat.git . || true
              git fetch origin master && git reset --hard origin/master
            fi
            bash "$DEPLOY_PATH/deploy/initial-setup.sh"
        env:
          ECLIPSE_CHAT_DB_PASSWORD: ${{ secrets.ECLIPSE_CHAT_DB_PASSWORD }}
          ECLIPSE_CHAT_JWT_SECRET: ${{ secrets.ECLIPSE_CHAT_JWT_SECRET }}

      # --- Регулярный деплой: orchestrator deploy.sh делает всё ---
      # Workflow сам делает git pull перед bash deploy.sh — иначе chicken-egg:
      # если на проде старый commit без deploy/scripts/, файл просто не существует.
      # После initial pull deploy.sh сам делает второй reset --hard как [1/12] step
      # (идемпотентно, harmless).
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST_PROD }}
          username: ${{ secrets.DEPLOY_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 15m
          envs: ECLIPSE_RELEASE_SHA,OFFICE_INGEST_SENTINEL_ENABLED,OFFICE_INGEST_SENTINEL_SECRET,OFFICE_INGEST_SENTINEL_KEY_ID,OFFICE_INGEST_SENTINEL_PRODUCER_ID,OFFICE_INGEST_SENTINEL_WORKSPACE_ID
          script: |
            set -e
            cd /var/www/eclipse-chat
            echo "==> Pre-deploy verified database backups"
            test "$(readlink -f /var/www/eclipse-chat)" = "/var/www/eclipse-chat"
            sudo bash -se <<'ECLIPSE_RELEASE_BACKUP'
            set -euo pipefail
            umask 077
            set -o noclobber
            # The privileged env reader requires a trusted, non-writable parent chain.
            env_parent=/var/www/eclipse-chat/apps/server
            while [[ "$env_parent" != "/" ]]; do
              test "$(readlink -f "$env_parent")" = "$env_parent"
              test "$(stat -c %u "$env_parent")" = 0
              parent_mode=$(stat -c %a "$env_parent")
              test "$((8#$parent_mode & 0022))" -eq 0
              env_parent=$(dirname "$env_parent")
            done
            echo "Verified root-owned, non-writable environment parent chain"
            # Confirm the targets against both production app and backup configuration.
            grep -Eq "^DB_CONNECTION=['\"]?pgsql['\"]?[[:space:]]*$" /var/www/app.star-crm.ru/backend/.env
            grep -Eq "^DB_HOST=['\"]?127[.]0[.]0[.]1['\"]?[[:space:]]*$" /var/www/app.star-crm.ru/backend/.env
            grep -Eq "^DB_PORT=['\"]?5432['\"]?[[:space:]]*$" /var/www/app.star-crm.ru/backend/.env
            grep -Eq "^DB_DATABASE=['\"]?star_crm_prod['\"]?[[:space:]]*$" /var/www/app.star-crm.ru/backend/.env
            grep -Eq "^PGHOST=['\"]?127[.]0[.]0[.]1['\"]?[[:space:]]*$" /etc/star-crm-backup.env
            grep -Eq "^PGPORT=['\"]?5432['\"]?[[:space:]]*$" /etc/star-crm-backup.env
            grep -Eq "^PGDATABASE=['\"]?star_crm_prod['\"]?[[:space:]]*$" /etc/star-crm-backup.env
            backup_root=/var/backups/eclipse-chat
            if [[ -e "$backup_root" && "$(readlink -f "$backup_root")" != "$backup_root" ]]; then
              echo "Refusing unexpected backup path" >&2
              exit 1
            fi
            available_kb=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
            test "$available_kb" -ge 524288
            install -d -m 0700 -o root -g root "$backup_root"
            test "$(readlink -f "$backup_root")" = "$backup_root"
            free_kb=$(df -Pk "$backup_root" | awk 'NR==2 {print $4}')
            database_bytes=$(sudo -u postgres psql -Atqc "SELECT COALESCE(SUM(pg_database_size(oid)),0) FROM pg_database WHERE datname IN ('eclipse_chat','star_crm_prod')")
            test "$free_kb" -ge "$((database_bytes / 1024 * 2 + 1048576))"
            backup_dir=$(mktemp -d "$backup_root/release-$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")
            for database in eclipse_chat star_crm_prod; do
              sudo -u postgres pg_dump --format=custom --no-owner --no-acl "$database" > "$backup_dir/$database.dump"
              test "$(stat -c%s "$backup_dir/$database.dump")" -gt 100
              pg_restore --list "$backup_dir/$database.dump" > /dev/null
              stat -c 'Verified backup: %n (%s bytes, %a)' "$backup_dir/$database.dump"
            done
            ECLIPSE_RELEASE_BACKUP
            echo "==> Pre-pull (workflow bootstrap, до deploy.sh)"
            test "$(printf %s "$ECLIPSE_RELEASE_SHA" | grep -Ec '^[0-9a-f]{40}$')" = 1
            git fetch origin master
            test "$(git rev-parse origin/master)" = "$ECLIPSE_RELEASE_SHA"
            git reset --hard "$ECLIPSE_RELEASE_SHA"
            echo "==> Running deploy/scripts/deploy.sh"
            bash deploy/scripts/deploy.sh
        env:
          ECLIPSE_RELEASE_SHA: ${{ github.sha }}
          OFFICE_INGEST_SENTINEL_ENABLED: ${{ vars.OFFICE_INGEST_SENTINEL_ENABLED }}
          OFFICE_INGEST_SENTINEL_SECRET: ${{ secrets.OFFICE_INGEST_SENTINEL_20260824_SECRET }}
          OFFICE_INGEST_SENTINEL_KEY_ID: ${{ vars.OFFICE_INGEST_SENTINEL_KEY_ID }}
          OFFICE_INGEST_SENTINEL_PRODUCER_ID: ${{ vars.OFFICE_INGEST_SENTINEL_PRODUCER_ID }}
          OFFICE_INGEST_SENTINEL_WORKSPACE_ID: ${{ vars.OFFICE_INGEST_SENTINEL_WORKSPACE_ID }}

      # --- Post-deploy: independent smoke от CI runner (не из prod),
      #     чтобы убедиться что внешний пользователь видит работающий сервис ---
      - name: External smoke (from CI runner)
        run: |
          set -e
          BASE="https://app.star-crm.ru/eclipse-chat"

          echo "→ /api/version"
          curl -sf --max-time 10 "$BASE/api/version" | tee /tmp/version.json
          grep -q '"version"' /tmp/version.json

          echo ""
          echo "→ /api/health"
          curl -sf --max-time 10 "$BASE/api/health" | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"database":true' /tmp/health.json

          echo ""
          echo "→ frontend index.html"
          curl -sI --max-time 10 "$BASE/" | grep -i '^content-type:.*text/html'

          echo ""
          echo "✓ Eclipse Chat live на $BASE/"
