name: Production diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read bounded Eclipse Chat startup diagnostics
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST_PROD }}
          username: ${{ secrets.DEPLOY_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 2m
          script: |
            set -eu
            echo "==> Backup target metadata (no credentials)"
            for config in /var/www/app.star-crm.ru/backend/.env /etc/star-crm-backup.env; do
              if sudo test -f "$config"; then
                sudo stat -c '%a %U:%G %n' "$config"
                sudo awk -F= '
                  /^(DB_CONNECTION|DB_HOST|DB_PORT|DB_DATABASE|PGHOST|PGPORT|PGDATABASE)=/ {
                    value=substr($0, index($0,"=")+1)
                    gsub(/^[ \t\047\042]+|[ \t\r\047\042]+$/, "", value)
                    if (value ~ /^[A-Za-z0-9_.-]+$/) print $1 "=" value
                    else print $1 "=[non-simple value; operator verification required]"
                  }
                  /^DB_URL=/ { print "DB_URL override is present; operator verification required" }
                ' "$config"
              else
                echo "Missing documented config: $config"
              fi
            done
            echo "==> Known backup locations"
            for backup_path in /var/backups/eclipse-chat /var/backups/star-crm/db /usr/local/sbin/star-crm-db-backup; do
              if sudo test -e "$backup_path"; then
                sudo stat -c '%a %U:%G %n' "$backup_path"
              fi
            done
            APP=/var/www/eclipse-chat/apps/server
            echo "==> Supervisor"
            sudo supervisorctl status eclipse-chat-server || true
            echo "==> File access"
            sudo stat -c '%A %U:%G %n' "$APP" "$APP/dist" "$APP/dist/index.js" "$APP/.env"
            sudo -u www-data test -r "$APP/.env" && echo '.env readable: yes' || echo '.env readable: no'
            sudo -u www-data test -r "$APP/dist/index.js" && echo 'index readable: yes' || echo 'index readable: no'
            echo "==> Environment variable names only"
            sudo awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/{print $1}' "$APP/.env" | sort -u
            echo "==> Sanitized stderr tail"
            sudo tail -n 120 /var/log/supervisor/eclipse-chat.err.log \
              | sed -E 's#postgres(ql)?://[^[:space:]]+#postgresql://[REDACTED]#g; s/[A-Za-z0-9_-]{32,}/[REDACTED]/g' \
              | tail -n 120
