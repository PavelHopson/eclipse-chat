[package]
name = "eclipse-chat-desktop"
version = "1.0.9"
description = "Eclipse Chat desktop shell (Tauri 2)"
authors = ["Pavel Hopson <hopsintoxin@mail.ru>"]
edition = "2021"

# Library: shared между binary (main.rs) и mobile (Tauri 2 mobile когда дойдём
# до Phase C на iOS/Android). lib.rs содержит фактический Tauri entry point —
# main.rs просто вызывает его.
[lib]
name = "eclipse_chat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# v1.0.3 — feature "tray-icon" нужен для system tray (TrayIconBuilder).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# v1.5.39 — Phase B Tauri #2 plugins:
#   notification — native OS notifications (Action Center / Notification Center / libnotify)
#   updater      — auto-update from GitHub Releases (signed manifest)
#   window-state — persists window position/size between launches
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# Explicit user-controlled launch at OS login. Remote web content receives
# only enable/disable/is-enabled through a dedicated capability.
tauri-plugin-autostart = "2"
# v1.0.3 — глобальный шорткат Ctrl+Shift+E (показать/сфокусировать окно).
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
futures-util = "0.3"
mime_guess = "2"
pem = "4"
rcgen = "0.14"
rfd = "0.15"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
open = "5"
localsend = { version = "0.1.0", path = "vendor/localsend-core", features = ["crypto", "discovery", "http", "multicast"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
